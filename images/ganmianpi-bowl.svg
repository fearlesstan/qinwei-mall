<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#F6EAD2"/>
      <stop offset="68%" stop-color="#FAF3E4"/>
      <stop offset="100%" stop-color="#FAF3E4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowlG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#E9DCC6"/>
    </linearGradient>
    <linearGradient id="noodleG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E0"/>
      <stop offset="100%" stop-color="#EFDFBE"/>
    </linearGradient>
    <linearGradient id="chiliG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E85A41"/>
      <stop offset="55%" stop-color="#C83826"/>
      <stop offset="100%" stop-color="#A92A20"/>
    </linearGradient>
  </defs>

  <!-- 背景圆盘 -->
  <circle cx="320" cy="306" r="274" fill="url(#bgG)"/>

  <!-- 热气 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".55">
    <path d="M248 252c-13-20-7-47 6-64 10-14 0-29-4-41"/>
    <path d="M322 236c-2-23 13-43 29-51 12-7 9-22 3-32"/>
    <path d="M396 252c14-17 21-41 11-59-6-12 2-25 10-35"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="320" cy="600" rx="212" ry="30" fill="#5A3A1E" opacity=".12"/>

  <!-- 碗 -->
  <g>
    <path d="M86 450 C86 588 190 622 320 622 C450 622 554 588 554 450 Z" fill="url(#bowlG)"/>
    <ellipse cx="320" cy="620" rx="84" ry="13" fill="#E0D0B4"/>
    <!-- 碗内 -->
    <ellipse cx="320" cy="450" rx="206" ry="44" fill="#EFE1C7"/>
    <!-- 面皮堆 -->
    <path d="M132 438 C138 340 205 288 320 288 C435 288 502 340 508 438 C492 432 470 442 446 434 C416 424 396 438 368 432 C340 426 320 436 296 430 C268 423 248 436 224 430 C200 424 178 434 158 428 C148 425 136 432 132 438 Z" fill="url(#noodleG)" stroke="#E6D4B0" stroke-width="2.5"/>
    <!-- 面皮纹路 -->
    <path d="M176 404 q64 20 132 6 M300 430 q62 -14 118 -4" fill="none" stroke="#E9D8B2" stroke-width="7" opacity=".85" stroke-linecap="round"/>
    <!-- 红油 -->
    <path d="M205 372 C200 330 240 292 320 292 C400 292 440 330 435 372 C430 402 390 420 320 420 C250 420 210 402 205 372 Z" fill="url(#chiliG)" stroke="#8F231E" stroke-opacity=".35" stroke-width="3"/>
    <!-- 红油高光 -->
    <path d="M232 318 C255 306 300 302 336 308" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".34"/>
    <circle cx="252" cy="330" r="6" fill="#FFF" opacity=".3"/>
    <!-- 面筋块 -->
    <rect x="272" y="330" width="27" height="23" rx="7" fill="#C08A58" stroke="#A8753F" stroke-width="1.6"/>
    <rect x="316" y="344" width="27" height="23" rx="7" fill="#C9935F" stroke="#A8753F" stroke-width="1.6"/>
    <rect x="358" y="328" width="27" height="23" rx="7" fill="#C08A58" stroke="#A8753F" stroke-width="1.6"/>
    <rect x="296" y="362" width="24" height="20" rx="6" fill="#BD8653" stroke="#A8753F" stroke-width="1.6"/>
    <!-- 黄瓜丝 -->
    <g>
      <rect x="236" y="342" width="11" height="27" rx="5.5" fill="#86A85C" stroke="#6E8F47" stroke-width="1.4" transform="rotate(16 241 355)"/>
      <rect x="396" y="338" width="11" height="27" rx="5.5" fill="#8FB166" stroke="#6E8F47" stroke-width="1.4" transform="rotate(-14 401 351)"/>
      <rect x="318" y="302" width="11" height="24" rx="5.5" fill="#86A85C" stroke="#6E8F47" stroke-width="1.4" transform="rotate(-6 323 314)"/>
    </g>
    <!-- 辣椒碎 -->
    <g fill="#9C2419">
      <circle cx="258" cy="396" r="5"/><circle cx="302" cy="400" r="4"/>
      <circle cx="344" cy="396" r="5"/><circle cx="378" cy="382" r="4"/>
      <circle cx="226" cy="376" r="4"/><circle cx="412" cy="368" r="3.5"/>
      <circle cx="262" cy="368" r="3.5"/><circle cx="332" cy="370" r="3"/>
    </g>
    <!-- 白芝麻 -->
    <g fill="#FDF6E3">
      <ellipse cx="246" cy="386" rx="3" ry="4.5"/><ellipse cx="288" cy="374" rx="3" ry="4.5"/>
      <ellipse cx="322" cy="384" rx="3" ry="4.5"/><ellipse cx="364" cy="372" rx="3" ry="4.5"/>
      <ellipse cx="398" cy="360" rx="3" ry="4.5"/><ellipse cx="272" cy="358" rx="3" ry="4.5"/>
    </g>
    <!-- 葱花 -->
    <g fill="#5E8C4A">
      <circle cx="290" cy="382" r="3.4"/><circle cx="350" cy="376" r="3.4"/>
      <circle cx="260" cy="358" r="2.8"/><circle cx="374" cy="386" r="2.8"/>
    </g>
    <!-- 碗沿（前景，压住面堆底部） -->
    <ellipse cx="320" cy="450" rx="230" ry="54" fill="#F7EEDA" stroke="#DCCBAD" stroke-width="2.5"/>
    <path d="M110 450 C110 480 200 500 320 500 C440 500 530 480 530 450" fill="none" stroke="#FFFDF7" stroke-width="3" opacity=".7"/>
    <!-- 碗身花纹 -->
    <path d="M140 470 C180 505 260 528 320 528 C380 528 460 505 500 470" fill="none" stroke="#C0392B" stroke-width="2" opacity=".4" stroke-dasharray="1 10" stroke-linecap="round"/>
  </g>

  <!-- 筷子 -->
  <g>
    <line x1="522" y1="292" x2="606" y2="376" stroke="#7A4A2B" stroke-width="10" stroke-linecap="round"/>
    <line x1="538" y1="298" x2="620" y2="380" stroke="#8A5633" stroke-width="10" stroke-linecap="round"/>
    <line x1="598" y1="368" x2="606" y2="376" stroke="#C9A97F" stroke-width="10" stroke-linecap="round"/>
    <line x1="612" y1="372" x2="620" y2="380" stroke="#D4B68A" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 红辣椒点缀 -->
  <g>
    <path d="M98 258 C80 300 96 332 122 342" fill="none" stroke="#C0392B" stroke-width="16" stroke-linecap="round"/>
    <path d="M116 262 C112 250 104 242 94 238" fill="none" stroke="#6E8F47" stroke-width="7" stroke-linecap="round"/>
    <path d="M128 300 C122 292 112 288 104 288" fill="none" stroke="#6E8F47" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
