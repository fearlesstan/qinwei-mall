<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#EAE4D6" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="oilG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6331F"/>
      <stop offset="100%" stop-color="#8F1B12"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B25C"/>
      <stop offset="100%" stop-color="#A97F22"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="324" rx="108" ry="15" fill="#5A3A1E" opacity=".12"/>

  <!-- 辣椒点缀 -->
  <g>
    <path d="M64 296 C56 278 62 258 76 250" fill="none" stroke="#C0392B" stroke-width="11" stroke-linecap="round"/>
    <path d="M74 252 C70 244 64 238 56 236" fill="none" stroke="#6E8F47" stroke-width="5" stroke-linecap="round"/>
    <path d="M86 308 C80 296 88 282 98 276" fill="none" stroke="#C0392B" stroke-width="11" stroke-linecap="round"/>
    <path d="M96 278 C92 270 86 264 78 262" fill="none" stroke="#6E8F47" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 瓶身 -->
  <g>
    <rect x="100" y="112" width="160" height="192" rx="28" fill="url(#glassG)" stroke="#D8CFBA" stroke-width="2"/>
    <!-- 玻璃反光 -->
    <rect x="114" y="124" width="10" height="152" rx="5" fill="#FFFFFF" opacity=".55"/>
    <!-- 红油 -->
    <rect x="112" y="124" width="136" height="168" rx="18" fill="url(#oilG)"/>
    <ellipse cx="180" cy="124" rx="68" ry="14" fill="#E0482F"/>
    <!-- 漂浮辣椒碎 -->
    <circle cx="150" cy="180" r="3.2" fill="#C41E12"/><circle cx="192" cy="200" r="2.6" fill="#C41E12"/>
    <circle cx="168" cy="222" r="2.2" fill="#C41E12"/><circle cx="206" cy="176" r="3" fill="#E26B52"/>
    <circle cx="162" cy="252" r="2.4" fill="#B8170E"/><circle cx="198" cy="244" r="2" fill="#B8170E"/>
    <!-- 表面辣椒碎 -->
    <g>
      <rect x="146" y="116" width="10" height="6" rx="2" fill="#B8170E" transform="rotate(24 151 119)"/>
      <rect x="170" y="112" width="11" height="6" rx="2" fill="#C41E12" transform="rotate(-18 175 115)"/>
      <rect x="192" y="117" width="10" height="6" rx="2" fill="#B8170E" transform="rotate(30 197 120)"/>
      <rect x="212" y="114" width="9" height="5" rx="2" fill="#C41E12" transform="rotate(-12 216 116)"/>
      <ellipse cx="160" cy="122" rx="2.4" ry="3.4" fill="#FDF6E3"/>
      <ellipse cx="186" cy="120" rx="2.4" ry="3.4" fill="#FDF6E3"/>
      <ellipse cx="206" cy="122" rx="2.4" ry="3.4" fill="#FDF6E3"/>
    </g>
    <!-- 标签 -->
    <rect x="106" y="158" width="148" height="100" rx="10" fill="#FBF6EE" stroke="#E2D2B4" stroke-width="1.6"/>
    <text x="180" y="196" text-anchor="middle" font-size="25" fill="#201410" font-family="serif" font-weight="bold">油泼辣子</text>
    <text x="180" y="220" text-anchor="middle" font-size="11" letter-spacing="4" fill="#A07C2E">香辣 · 百搭</text>
    <g transform="translate(180 240)">
      <circle cx="-12" cy="0" r="5" fill="#C0392B"/><circle cx="0" cy="0" r="5" fill="#C0392B"/><circle cx="12" cy="0" r="5" fill="#C0392B"/>
      <path d="M-12 -5 C-16 -14 -10 -18 -4 -16" fill="none" stroke="#6E8F47" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M0 -5 C-4 -14 2 -18 8 -16" fill="none" stroke="#6E8F47" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M12 -5 C8 -14 14 -18 20 -16" fill="none" stroke="#6E8F47" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <!-- 瓶盖 -->
    <rect x="92" y="82" width="176" height="40" rx="10" fill="url(#goldG)" stroke="#A5802C" stroke-width="1.6"/>
    <path d="M108 84 h144 v8 h-144 Z" fill="#E9C97C" opacity=".7"/>
  </g>

  <g>
    <circle cx="300" cy="62" r="32" fill="#B3302A" stroke="#FBF6EE" stroke-width="3"/>
    <text x="300" y="75" text-anchor="middle" font-size="30" fill="#FBF6EE" font-family="serif" font-weight="bold">辣</text>
  </g>
</svg>
