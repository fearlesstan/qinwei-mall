<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="pouchG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7EDDA"/>
      <stop offset="55%" stop-color="#FDF9F0"/>
      <stop offset="100%" stop-color="#EFE2C9"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="330" rx="104" ry="15" fill="#5A3A1E" opacity=".12"/>

  <!-- 真空袋 -->
  <g>
    <path d="M112 44 h136 a18 18 0 0 1 18 18 v236 a18 18 0 0 1 -18 18 h-136 a18 18 0 0 1 -18 -18 V62 a18 18 0 0 1 18 -18 Z" fill="url(#pouchG)" stroke="#E2D2B4" stroke-width="2"/>
    <!-- 封口条 -->
    <path d="M112 44 h136 a18 18 0 0 1 18 18 v18 h-172 v-18 a18 18 0 0 1 18 -18 Z" fill="#B3302A"/>
    <path d="M112 62 h136 v14 h-136 Z" fill="#B3302A"/>
    <!-- 撕口 -->
    <path d="M152 44 l8 8 8 -8" fill="none" stroke="#FBF6EE" stroke-width="2.5"/>
    <!-- 品牌英文 -->
    <text x="180" y="104" text-anchor="middle" font-size="11" letter-spacing="5" fill="#8A6B3F" font-family="Georgia, serif">QINWEI</text>
    <!-- 红色招牌 -->
    <rect x="118" y="116" width="124" height="46" rx="8" fill="#B3302A"/>
    <text x="180" y="149" text-anchor="middle" font-size="29" fill="#FBF6EE" font-family="serif" font-weight="bold">擀面皮</text>
    <!-- 小碗插画 -->
    <g>
      <ellipse cx="180" cy="216" rx="36" ry="26" fill="#F1E4C8" stroke="#E2D2B4" stroke-width="1.6"/>
      <path d="M152 210 a36 26 0 0 0 56 0" fill="none" stroke="#DCCBAD" stroke-width="1.6"/>
      <path d="M158 208 q10 -8 22 -8 t22 8" fill="none" stroke="#EFE0C2" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="180" cy="204" rx="22" ry="9" fill="#C0392B"/>
      <circle cx="172" cy="203" r="2" fill="#FDF6E3"/><circle cx="184" cy="202" r="2" fill="#FDF6E3"/>
      <circle cx="178" cy="206" r="1.6" fill="#9C2419"/>
      <line x1="210" y1="188" x2="228" y2="170" stroke="#7A4A2B" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="218" y1="190" x2="234" y2="174" stroke="#8A5633" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <!-- 锁鲜徽章 -->
    <rect x="132" y="248" width="96" height="26" rx="13" fill="#5F7F4E"/>
    <text x="180" y="266" text-anchor="middle" font-size="13" fill="#FBF6EE" font-weight="bold" letter-spacing="2">真空锁鲜</text>
    <!-- 净含量 -->
    <text x="180" y="296" text-anchor="middle" font-size="12" fill="#8A6B3F">净含量 230g × 6 袋</text>
    <!-- 非遗印章 -->
    <g transform="rotate(-8 288 296)">
      <rect x="262" y="272" width="52" height="52" rx="10" fill="#C39A3B"/>
      <text x="288" y="294" text-anchor="middle" font-size="16" fill="#3B2A12" font-family="serif" font-weight="bold">非遗</text>
      <text x="288" y="314" text-anchor="middle" font-size="12" fill="#3B2A12" font-family="serif">工艺</text>
    </g>
  </g>
</svg>
